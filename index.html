<head>

<body>
  <div class="noise"></div>
  <header class="hero">
    <p class="eyebrow">IN MEMORY · IN CELEBRATION</p>
    <h1>丧事喜办</h1>
    <p class="subtitle">肃穆为底色，喜庆作锋芒。以最高规格，致敬每一段不灭的光。</p>
    <a class="cta" href="#ritual">进入典礼</a>

  <main>
    <section id="ritual" class="panel">
      <h2>礼序</h2>
      <p>黑金的庄重，绛红的热烈，交织出“悲而不伤，喜而有仪”的独特气场。</p>
      <div class="stats">
        <article>
          <strong>01</strong>
          <span>礼乐齐鸣</span>
        </article>
        <article>
          <strong>02</strong>
          <span>万盏同辉</span>
        </article>
        <article>
          <strong>03</strong>
          <span>永志不忘</span>
        </article>
      </div>
    </section>

    <section class="panel quote">
      <blockquote>
        “人生如宴，散场亦是篇章。<br />
        今日隆重，不为喧哗，只为体面与铭记。”
      </blockquote>
    </section>
  </main>

  <footer>
    <p>WHXNMSL · Grand Memorial Ceremony</p>
  </footer>

  <script src="./script.js"></script>
